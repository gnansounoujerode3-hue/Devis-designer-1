# Configuration Netlify pour Devis Designer
# Déploiement : glisser-déposer le dossier dist/ sur app.netlify.com/drop
# ou connecter un dépôt (build: npm run build, publish: dist)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"   # Vite 7 exige ^20.19 || >=22.12 ; aligné sur la commande GH Pages du README

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
